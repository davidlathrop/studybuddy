[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studybuddy"
version = "0.1.0"
description = "Turn MP4 lectures into MP3 audio and transcripts, locally on Apple silicon."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-audio[stt]>=0.5.8,<0.6",
    "numpy>=1.26.4",
    "anthropic[bedrock]>=1.14,<2",
    "rapidfuzz>=3.14,<4",
    "python-pptx>=1.0.2,<2",
    "python-docx>=1.2,<2",
    "pypdfium2>=5.14,<6",
    "pillow>=10.1",
    "ocrmac>=1.0.1,<2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jiwer>=3",
]

[project.scripts]
studybuddy = "studybuddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"studybuddy.enrich" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "model: loads a real ASR model (slow; runs only when STUDYBUDDY_MODEL_TESTS=1)",
    "office: drives PowerPoint/Word to convert files (runs only when STUDYBUDDY_OFFICE_TESTS=1)",
]
